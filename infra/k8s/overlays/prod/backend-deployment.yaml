apiVersion: apps/v1
kind: Deployment
metadata:
  name: svt-backend
  namespace: svt-system
spec:
  replicas: 3
  selector:
    matchLabels:
      app: svt-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: svt-backend
    spec:
      containers:
        - name: backend
          image: ARTIFACT_REGISTRY_IMAGE
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: svt-backend-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
