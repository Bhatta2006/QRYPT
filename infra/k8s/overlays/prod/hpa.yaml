apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: svt-backend-hpa
  namespace: svt-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: svt-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "100"
