# =============================================================================
# SVT System — Redis Configuration
# =============================================================================

# --- Memory ---
maxmemory 512mb
maxmemory-policy allkeys-lru

# --- Persistence (AOF) ---
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# --- Security ---
# Password set via requirepass in docker-compose command override
# bind 0.0.0.0 (container-only access via Docker network)

# --- Connections ---
maxclients 10000
timeout 300
tcp-keepalive 60

# --- Streams ---
# Stream-specific: keep entries trimmed for memory efficiency
# Application uses MAXLEN ~ on XADD for per-stream control

# --- Logging ---
loglevel notice
