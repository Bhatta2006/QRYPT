# =============================================================================
# Prometheus Alert Rules — SVT System
# =============================================================================

groups:
  - name: svt_alerts
    rules:
      - alert: ScanP99High
        expr: histogram_quantile(0.99, rate(scan_verify_duration_seconds_bucket[5m])) > 0.2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Scan P99 latency > 200ms"
          description: "P99 = {{ $value | humanizeDuration }}"

      - alert: ErrorRateHigh
        expr: rate(svt_scans_total{result="DENY"}[5m]) / rate(svt_scans_total[5m]) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Scan error rate > 1%"

      - alert: AnomalySpike
        expr: rate(svt_anomalies_total[5m]) > 3 * rate(svt_anomalies_total[1h])
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Anomaly rate 3x above baseline"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory > 80%"

      # extra — not in blueprint spec
      - alert: PostgresConnectionsHigh
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL active connections exceeds 80"
          description: "Active connections: {{ $value }}"

      # extra — not in blueprint spec
      - alert: PostgresBackupFailed
        expr: time() - pg_backup_last_success_timestamp > 172800
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL backup has not succeeded in 48 hours"
